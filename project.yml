name: DonkeyKong
options:
  bundleIdPrefix: fr.lauriat
  deploymentTarget:
    macOS: "14.0"
    iOS: "26.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
packages:
  DonkeyKongCore:
    path: Core
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.1"                          # matches the fleet and Templates/Scripts/release-full.sh
settings:
  base:
    SWIFT_VERSION: "5.0"                 # app layer: Swift 5 language mode — SpriteKit/GameController are poorly annotated for Swift 6
    SWIFT_STRICT_CONCURRENCY: minimal    # Core/ stays in Swift 6 mode via its tools-version
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: "NO"
    PRODUCT_NAME: Barrel Climb
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: "NO"
targets:
  DonkeyKong:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: App/Sources
      - path: App/Platform/macOS
        destinationFilters: [macOS]
      - path: App/Platform/iOS
        destinationFilters: [iOS]
      - path: App/Resources/Assets.xcassets
      - path: App/Resources/sprites
        type: folder
        buildPhase: resources
      - path: App/Resources/sounds
        type: folder
        buildPhase: resources
    dependencies:
      - package: DonkeyKongCore
      - sdk: SpriteKit.framework
      - sdk: GameController.framework
      - package: Sparkle                   # Sparkle declares platforms: [.macOS] — an iOS
        destinationFilters: [macOS]        # destination cannot even resolve it
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Barrel Climb
        CFBundleName: Barrel Climb
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSApplicationCategoryType: public.app-category.arcade-games
        # Sparkle (macOS only; iOS ignores these keys). The appcast rides on the same
        # GitHub Pages site as the landing page, served from main:/docs.
        SUFeedURL: "https://vincentlauriat.github.io/barrel-climb/appcast.xml"
        SUPublicEDKey: "ZHNhjzBxHMkQSm/fnMFJ0uQkwH7U7wymROlaOKg0kMA="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false
        NSHighResolutionCapable: true
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown]
        GCSupportsControllerUserInteraction: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        # XcodeGen gives a multi-destination app the iOS runpath only
        # (@executable_path/Frameworks). A macOS bundle keeps its frameworks in
        # Contents/Frameworks, one level above the executable, so Sparkle fails to
        # load at launch without this SDK-conditional override.
        LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]: "@executable_path/../Frameworks @loader_path/../Frameworks"
    scheme:
      testTargets: []
